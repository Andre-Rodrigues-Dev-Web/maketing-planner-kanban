name: Publicar aplicação

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: marketing-planner-react/package-lock.json

      - name: Instalar dependências
        working-directory: marketing-planner-react
        run: npm ci

      - name: Gerar build de produção
        working-directory: marketing-planner-react
        run: npm run build

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      - name: Empacotar artefato
        uses: actions/upload-pages-artifact@v3
        with:
          path: marketing-planner-react/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
